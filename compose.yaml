services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: transaction_import
      DB_USERNAME: transaction_import
      DB_PASSWORD: transaction_import
    depends_on:
      mysql:
        condition: service_healthy
    command: php -v

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: transaction_import
      MYSQL_USER: transaction_import
      MYSQL_PASSWORD: transaction_import
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -proot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
