image: dunglas/frankenphp:1.13.3-php8.5.12-trixie

services:
  - name: mysql:9.7.4
    alias: mysql

variables:
  MYSQL_DATABASE: transaction_import
  MYSQL_USER: transaction_import
  MYSQL_PASSWORD: transaction_import
  MYSQL_ROOT_PASSWORD: root
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: transaction_import
  DB_USERNAME: transaction_import
  DB_PASSWORD: transaction_import

before_script:
  - apt-get update && apt-get install -y default-mysql-client
  - until mysqladmin ping -h mysql -uroot -proot --silent; do sleep 1; done
  - mysql -h mysql -uroot -proot transaction_import < docker/mysql/init.sql
  - install-php-extensions pdo_mysql zip
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --no-interaction --prefer-dist --no-progress

quality:
  stage: test
  script:
    - composer quality
